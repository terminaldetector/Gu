name: Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/requirements.txt
      - name: Check Male CNS streaming converter
        run: python tools/male_cns_converter_check.py
      - name: Ensure GPU test libraries
        run: |
          if ! python -c "import ctypes,pathlib;ctypes.CDLL('libEGL.so.1');ctypes.CDLL('libGLESv2.so.2');assert pathlib.Path('/usr/lib/x86_64-linux-gnu/dri/swrast_dri.so').exists()"; then
            sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0 update
            sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0 install -y libegl1 libgles2 libgl1-mesa-dri
          fi
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.57'
      - run: python tools/build_sega.py
      - run: python tools/build_retro.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlyConsole-retro-cores
          path: |
            app/src/main/assets/lab/gb/
            app/src/main/assets/lab/snes/
            app/src/main/assets/lab/sega/
      - run: python tools/make_retro_roms.py
      - run: bash tools/check.sh
      - name: Install UI test browser
        run: |
          npm install --prefix /tmp/fly-ui playwright@1.51.1
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            /tmp/fly-ui/node_modules/.bin/playwright install chromium
          fi
      - name: Check portrait and landscape console layouts
        timeout-minutes: 3
        run: |
          ui_status=0
          NODE_PATH=/tmp/fly-ui/node_modules node tools/console_layout_check.cjs || ui_status=1
          NODE_PATH=/tmp/fly-ui/node_modules node tools/layer_ui_check.cjs || ui_status=1
          NODE_PATH=/tmp/fly-ui/node_modules node tools/platform_ui_check.cjs || ui_status=1
          NODE_PATH=/tmp/fly-ui/node_modules node tools/training_ui_check.cjs || ui_status=1
          exit "$ui_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlyConsole-ui-preview
          path: ui-preview/
      - run: python tools/gpu_runtime_check.py
      - run: python tools/bundle_data.py
      - name: Check full Male CNS model and CPU integration
        run: |
          male_test_classes=$(mktemp -d)
          javac -d "$male_test_classes" app/src/main/java/org/node/flyconsole/Graph.java app/src/main/java/org/node/flyconsole/GraphDelta.java app/src/main/java/org/node/flyconsole/Engine.java tools/MaleCnsGraphCheck.java
          java -Xmx512m -cp "$male_test_classes" org.node.flyconsole.MaleCnsGraphCheck app/src/main/assets/male-cns.fly.gz
      - run: gradle assembleDebug lintDebug
      - name: Collect official APK signing tool
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/flyconsole-apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: FlyConsole-apksigner
          path: /tmp/flyconsole-apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: FlyConsole-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Split APK for bounded mobile downloads
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app/build/outputs/apk/debug/app-debug.apk').read_bytes()
          size = 32_000_000
          for index, start in enumerate(range(0, len(source), size), 1):
              Path(f'/tmp/flyconsole-apk-part-{index}').write_bytes(source[start:start + size])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FlyConsole-apk-part-1
          path: /tmp/flyconsole-apk-part-1
      - uses: actions/upload-artifact@v4
        with:
          name: FlyConsole-apk-part-2
          path: /tmp/flyconsole-apk-part-2
      - uses: actions/upload-artifact@v4
        with:
          name: FlyConsole-apk-part-3
          path: /tmp/flyconsole-apk-part-3
      - uses: actions/upload-artifact@v4
        with:
          name: FlyConsole-apk-part-4
          path: /tmp/flyconsole-apk-part-4
      - uses: actions/upload-artifact@v4
        with:
          name: FlyConsole-apk-part-5
          path: /tmp/flyconsole-apk-part-5
      - uses: actions/upload-artifact@v4
        with:
          name: FlyConsole-apk-part-6
          path: /tmp/flyconsole-apk-part-6

