plugins { id 'com.android.application' }
def guDigest = java.security.MessageDigest.getInstance('SHA-256')
def guSources = fileTree('src/main') { include 'java/**/*.java', 'assets/lab/**/*.js', 'assets/lab/**/*.html', 'assets/lab/**/*.css', 'assets/**/*source.json', 'assets/**/*.comp', 'res/**/*.xml', 'AndroidManifest.xml' }.files.toList().sort { it.path }
(guSources + [file('build.gradle')]).each { guDigest.update(project.relativePath(it).getBytes('UTF-8')); guDigest.update(it.bytes) }
def guSourceId = guDigest.digest().encodeHex().toString()
/* TECH-TEST BUILDS. Both properties are optional; with neither set the build is
   byte-for-byte the ordinary one CI makes. They give a test APK its own
   applicationId suffix and launcher label, so it installs SIDE BY SIDE with the
   normal app. */
def guTechId = project.findProperty('guTechId')
def guTechLabel = project.findProperty('guTechLabel') ?: 'FlyConsole'
/* MINIMAL CORE (architecture reset): no connectome is packaged. The graph file
   names are always excluded, even if an old checkout still has them on disk
   (the neural backend is archived on branch archive/gu-2be2dae-male-cns-fdb);
   tools/apk_minimal_core_check.py verifies the built APK. */
def guIgnored = ['!brain.fly.gz', '!brain.fly', '!brain.fly.json', '!male-cns.fly.gz', '!male-cns.fly', '!male-cns.fly.json']
android { namespace 'org.node.flyconsole'; compileSdk 35
 defaultConfig { applicationId 'org.node.flyconsole.nes'; minSdk 26; targetSdk 35; versionCode 44; versionName '3.0.0-core'; buildConfigField 'String', 'GU_SOURCE_ID', '"' + guSourceId + '"'
  buildConfigField 'String', 'TECH_ID', '"' + (guTechId ?: '') + '"'
  manifestPlaceholders = [appLabel: guTechLabel]
  if (guTechId) { applicationIdSuffix '.tech.' + guTechId.toLowerCase(); versionNameSuffix '-' + guTechId }
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 // Source bundles are already compressed; do not inflate packaging heap.
 androidResources { noCompress += ['gz', 'zip']
  // the AGP default pattern, plus the connectome files that are never packaged
  if (guIgnored) ignoreAssetsPattern = (['!.svn', '!.git', '!.ds_store', '!*.scc', '.*', '!CVS', '!thumbs.db', '!picasa.ini', '!*~'] + guIgnored).join(':')
 }
}
dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1' }

